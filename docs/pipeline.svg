<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="760" height="1120" fill="#ffffff"/>
  <style>
    .box { fill:#ffffff; stroke:#111827; stroke-width:2; }
    .boxAlt { fill:#eef2ff; stroke:#111827; stroke-width:2; }
    .human { fill:#dbeafe; stroke:#1e3a8a; stroke-width:2.5; }
    .stop { fill:#fee2e2; stroke:#991b1b; stroke-width:2; }
    .title { font-size:22px; font-weight:800; fill:#0f172a; }
    .titleHuman { font-size:22px; font-weight:800; fill:#1e3a8a; }
    .titleStop { font-size:20px; font-weight:800; fill:#991b1b; }
    .sub { font-size:16px; fill:#1f2937; }
    .subHuman { font-size:16px; fill:#1e3a8a; }
    .subStop { font-size:15px; fill:#991b1b; }
    .arrow { stroke:#111827; stroke-width:3; fill:none; marker-end:url(#head); }
    .arrowStop { stroke:#991b1b; stroke-width:2.5; fill:none; marker-end:url(#headStop); stroke-dasharray:6 4; }
    .edgeLabel { font-size:15px; font-weight:700; fill:#374151; }
    .edgeLabelStop { font-size:15px; font-weight:700; fill:#991b1b; }
    .caption { font-size:15px; fill:#111827; }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#111827"/>
    </marker>
    <marker id="headStop" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#991b1b"/>
    </marker>
  </defs>

  <!-- 1. Razorpay dispute -->
  <rect class="box" x="40" y="20" width="440" height="80" rx="12"/>
  <text class="title" x="260" y="55" text-anchor="middle">Razorpay</text>
  <text class="sub" x="260" y="82" text-anchor="middle">a dispute is created</text>
  <path class="arrow" d="M260,100 L260,140"/>

  <!-- 2. AI investigation -->
  <rect class="boxAlt" x="40" y="140" width="440" height="90" rx="12"/>
  <text class="title" x="260" y="175" text-anchor="middle">AI Investigation</text>
  <text class="sub" x="260" y="200" text-anchor="middle">Groq · reads only the merchant's</text>
  <text class="sub" x="260" y="220" text-anchor="middle">own records, cites every claim</text>
  <path class="arrow" d="M260,230 L260,270"/>

  <!-- 3. Verdict -->
  <rect class="boxAlt" x="40" y="270" width="440" height="90" rx="12"/>
  <text class="title" x="260" y="305" text-anchor="middle">Verdict</text>
  <text class="sub" x="260" y="330" text-anchor="middle">STRONG · WEAK · NO_CASE</text>
  <text class="sub" x="260" y="350" text-anchor="middle">+ evidence package</text>

  <!-- branch: NO_CASE -->
  <path class="arrowStop" d="M480,310 L560,310"/>
  <text class="edgeLabelStop" x="486" y="302">NO_CASE</text>
  <rect class="stop" x="560" y="270" width="160" height="90" rx="12"/>
  <text class="titleStop" x="640" y="305" text-anchor="middle">Not contested</text>
  <text class="subStop" x="640" y="326" text-anchor="middle">package build</text>
  <text class="subStop" x="640" y="344" text-anchor="middle">refused by design</text>

  <path class="arrow" d="M260,360 L260,400"/>

  <!-- 4. Human review -->
  <rect class="human" x="40" y="400" width="440" height="90" rx="12"/>
  <text class="titleHuman" x="260" y="435" text-anchor="middle">Human Review</text>
  <text class="subHuman" x="260" y="460" text-anchor="middle">approve · reject ·</text>
  <text class="subHuman" x="260" y="480" text-anchor="middle">ask for more evidence</text>

  <!-- branch: reject -->
  <path class="arrowStop" d="M480,445 L560,445"/>
  <text class="edgeLabelStop" x="500" y="437">reject</text>
  <rect class="stop" x="560" y="400" width="160" height="90" rx="12"/>
  <text class="titleStop" x="640" y="435" text-anchor="middle">Overruled</text>
  <text class="subStop" x="640" y="456" text-anchor="middle">human's call,</text>
  <text class="subStop" x="640" y="474" text-anchor="middle">logged either way</text>

  <text class="edgeLabel" x="272" y="510">approve</text>
  <path class="arrow" d="M260,490 L260,530"/>

  <!-- 5. Draft -->
  <rect class="boxAlt" x="40" y="530" width="440" height="80" rx="12"/>
  <text class="title" x="260" y="565" text-anchor="middle">Draft Saved</text>
  <text class="sub" x="260" y="592" text-anchor="middle">at Razorpay — nothing sent to the bank yet</text>
  <path class="arrow" d="M260,610 L260,650"/>

  <!-- 6. Human submits -->
  <rect class="human" x="40" y="650" width="440" height="90" rx="12"/>
  <text class="titleHuman" x="260" y="685" text-anchor="middle">Human Submits</text>
  <text class="subHuman" x="260" y="710" text-anchor="middle">the only click in this whole</text>
  <text class="subHuman" x="260" y="730" text-anchor="middle">system that reaches the bank</text>
  <path class="arrow" d="M260,740 L260,780"/>

  <!-- 7. Razorpay / bank -->
  <rect class="box" x="40" y="780" width="440" height="80" rx="12"/>
  <text class="title" x="260" y="815" text-anchor="middle">Razorpay → Issuing Bank</text>
  <text class="sub" x="260" y="842" text-anchor="middle">evidence goes out for a real decision</text>

  <!-- captions -->
  <line x1="40" y1="900" x2="720" y2="900" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="caption" x="40" y="935" font-weight="700">The AI never touches the blue boxes on its own.</text>
  <text class="caption" x="40" y="962">Every arrow into a blue box needs a person to click it — not a config flag, not a prompt instruction, an actual click.</text>
  <text class="caption" x="40" y="1000" font-weight="700">Demo disputes stop at "Draft."</text>
  <text class="caption" x="40" y="1027">They're simulated — there's no real Razorpay dispute behind them, so submission is blocked in code, not hidden in the UI.</text>
</svg>
