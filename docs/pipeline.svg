<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .box { fill:#ffffff; stroke:#1f2937; stroke-width:1.6; rx:10; }
    .boxAlt { fill:#f3f4f6; stroke:#1f2937; stroke-width:1.6; rx:10; }
    .human { fill:#eef2ff; stroke:#4338ca; stroke-width:1.8; rx:10; }
    .stop { fill:#fef2f2; stroke:#b91c1c; stroke-width:1.6; rx:10; }
    .title { font-size:14px; font-weight:700; fill:#111827; }
    .sub { font-size:11px; fill:#4b5563; }
    .arrow { stroke:#374151; stroke-width:2; fill:none; marker-end:url(#head); }
    .arrowDim { stroke:#9ca3af; stroke-width:1.6; fill:none; marker-end:url(#headDim); stroke-dasharray:4 3; }
    .label { font-size:11px; fill:#6b7280; }
    .humanLabel { font-size:11px; fill:#4338ca; font-weight:700; }
  </style>
  <defs>
    <marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#374151"/>
    </marker>
    <marker id="headDim" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- row 1: main pipeline -->
  <rect class="box" x="10" y="30" width="150" height="60"/>
  <text class="title" x="85" y="55" text-anchor="middle">Razorpay</text>
  <text class="sub" x="85" y="72" text-anchor="middle">dispute created</text>

  <path class="arrow" d="M160,60 L200,60"/>

  <rect class="boxAlt" x="200" y="30" width="170" height="60"/>
  <text class="title" x="285" y="52" text-anchor="middle">AI Investigation</text>
  <text class="sub" x="285" y="68" text-anchor="middle">Groq · reads merchant DB</text>
  <text class="sub" x="285" y="82" text-anchor="middle">only, cites every claim</text>

  <path class="arrow" d="M370,60 L410,60"/>

  <rect class="boxAlt" x="410" y="30" width="170" height="60"/>
  <text class="title" x="495" y="52" text-anchor="middle">Verdict</text>
  <text class="sub" x="495" y="68" text-anchor="middle">STRONG · WEAK · NO_CASE</text>
  <text class="sub" x="495" y="82" text-anchor="middle">+ evidence package</text>

  <path class="arrow" d="M580,60 L620,60"/>

  <rect class="human" x="620" y="30" width="170" height="60"/>
  <text class="title" x="705" y="52" text-anchor="middle" fill="#4338ca">Human Review</text>
  <text class="sub" x="705" y="68" text-anchor="middle" fill="#4338ca">approve / reject /</text>
  <text class="sub" x="705" y="82" text-anchor="middle" fill="#4338ca">ask for more</text>

  <path class="arrow" d="M790,60 L830,60"/>

  <rect class="boxAlt" x="830" y="30" width="150" height="60"/>
  <text class="title" x="905" y="52" text-anchor="middle">Draft</text>
  <text class="sub" x="905" y="68" text-anchor="middle">saved at Razorpay,</text>
  <text class="sub" x="905" y="82" text-anchor="middle">nothing sent yet</text>

  <path class="arrow" d="M980,60 L1020,60"/>

  <rect class="human" x="1020" y="30" width="150" height="60"/>
  <text class="title" x="1095" y="52" text-anchor="middle" fill="#4338ca">Human Submits</text>
  <text class="sub" x="1095" y="70" text-anchor="middle" fill="#4338ca">the only click that</text>
  <text class="sub" x="1095" y="84" text-anchor="middle" fill="#4338ca">reaches the bank</text>

  <!-- NO_CASE branch -->
  <path class="arrowDim" d="M495,90 L495,140 L370,140"/>
  <text class="label" x="500" y="130">NO_CASE</text>
  <rect class="stop" x="200" y="140" width="170" height="50"/>
  <text class="title" x="285" y="162" text-anchor="middle" fill="#b91c1c">Not contested</text>
  <text class="sub" x="285" y="178" text-anchor="middle" fill="#b91c1c">package build refused</text>

  <!-- reject branch -->
  <path class="arrowDim" d="M705,90 L705,140 L580,140"/>
  <text class="label" x="620" y="130">reject</text>
  <rect class="stop" x="410" y="140" width="170" height="50"/>
  <text class="title" x="495" y="162" text-anchor="middle" fill="#b91c1c">Overruled</text>
  <text class="sub" x="495" y="178" text-anchor="middle" fill="#b91c1c">human's call, logged</text>

  <!-- caption row -->
  <line x1="10" y1="230" x2="1170" y2="230" stroke="#e5e7eb" stroke-width="1"/>
  <text class="sub" x="10" y="255" font-size="12" fill="#374151">
    The AI never touches the last two boxes on its own. Every arrow into "Draft" and every arrow into "Submit" needs a person to click it.
  </text>
  <text class="sub" x="10" y="278" font-size="12" fill="#374151">
    Simulated demo disputes stop at "Draft" — there's no real Razorpay dispute behind them, so submission is blocked in code, not just hidden in the UI.
  </text>
</svg>
